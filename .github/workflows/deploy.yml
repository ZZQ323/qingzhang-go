name: Deploy Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 编译静态二进制
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o qingzhang .
          ls -lh qingzhang

      - name: 部署到服务器
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "qingzhang"
          TARGET: "/opt/qingzhang/_staging/"
          SCRIPT_AFTER: |
            set -e
            chmod +x /opt/qingzhang/_staging/qingzhang
            mv /opt/qingzhang/_staging/qingzhang /opt/qingzhang/qingzhang
            systemctl restart qingzhang
            sleep 2
            systemctl is-active qingzhang